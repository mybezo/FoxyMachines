# Enable automatic updates
auto-update: true

# Enable Chunk Loaders
# Disabled by default
chunk-loaders: false

# Maximum number of Chunk Loaders each player can place
# Set to 0 for no limit
max-chunk-loaders: 8

# GPS network complexity required per Chunk Loader
gps-complexity-per-loader: 7500

# Enable Ghost Blocks
# Disabled by default
ghost-blocks: false

# Enable the Forcefield Dome (and its Remote Controller)
# Disabled by default
forcefield-dome: false

# Enable the custom mobs of FoxyMachines
# When disabled, some recipes will change and some items will be removed
custom-mobs: true

# Maximum number of blocks the Fill Wand can fill at once
max-fill-wand-blocks: 4096

## Fill Wand whitelist and blacklist
# The lists contain Materials or Tags
# You can find all Materials here:
#   - https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
# Vanilla Tags and SlimefunTags can be found here:
#   - https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Tag.html
#   - https://slimefun.github.io/javadocs/Slimefun4/docs/io/github/thebusybiscuit/slimefun4/utils/tags/SlimefunTag.html
# If a Material and a Tag share the same name, only the Material is used
#
# Any Material in the whitelist is always allowed (highest priority)
# If a Material is not in the whitelist, it is allowed only if:
# - it is a block
# - it fully blocks light
# - it is not in the blacklist

# Fill Wand whitelist
fill-wand-white-list:
  - LEAVES
  - GLASS_BLOCKS

# Fill Wand blacklist
fill-wand-black-list:
  - BARRIER
  - SPAWNER
  - COMMAND_BLOCKS
  - STRUCTURE_BLOCK
  - JIGSAW

# Maximum number of blocks the Sponge Wand can clear at once
max-sponge-wand-blocks: 16384

